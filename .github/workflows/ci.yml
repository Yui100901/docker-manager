name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.7.0
  GOVULNCHECK_VERSION: v1.7.0
  GOSEC_VERSION: v2.28.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Unit tests with coverage
        if: runner.os == 'Linux'
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: |
          go run ./scripts/coverage-check \
            -profile coverage.out \
            -total 70 \
            -package internal/appconfig=85 \
            -package internal/dockerconfig=90 \
            -package internal/registryauth=85 \
            -package internal/runconfig=90 \
            -package internal/targets=95 \
            -package internal/docker=65 \
            -package internal/completion=85
      - name: Upload coverage profile
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: warn
      - name: Unit tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - run: go vet ./...
      - name: PowerShell checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1 -NoGoChecks -NoShellCheck
      - name: Shell syntax and ShellCheck
        if: runner.os == 'Linux'
        run: bash scripts/check.sh --no-go-checks

  security-static:
    name: Race and security/static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
      - name: Staticcheck gate
        run: |
          set -o pipefail
          staticcheck ./... 2>&1 | tee staticcheck-report.txt
      - name: Vulnerability gate
        if: always()
        run: govulncheck ./...
      - name: Upload staticcheck triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staticcheck-report
          path: staticcheck-report.txt
          if-no-files-found: error
      - name: gosec triage report
        if: always()
        run: gosec -no-fail -fmt text ./... | tee gosec-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gosec-report
          path: gosec-report.txt

  completion:
    name: Completion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux shell dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bash-completion zsh fish
      - name: Linux completion deep test
        if: runner.os == 'Linux'
        run: |
          go build -o "$RUNNER_TEMP/dm" .
          bash scripts/completion-test.sh \
            --dm-bin "$RUNNER_TEMP/dm" \
            --work-dir "$RUNNER_TEMP/dm-completion-linux" \
            --no-docker \
            --require-shells
      - name: Build Windows completion binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: go build -o (Join-Path $env:RUNNER_TEMP "dm.exe") .
      - name: PowerShell 7 completion deep test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/completion-test.ps1 `
            -DmBin (Join-Path $env:RUNNER_TEMP "dm.exe") `
            -WorkDir (Join-Path $env:RUNNER_TEMP "dm-completion-pwsh") `
            -NoDocker `
            -KeepWorkDir
      - name: Windows PowerShell 5.1 completion deep test
        if: runner.os == 'Windows' && always()
        shell: powershell
        run: |
          ./scripts/completion-test.ps1 `
            -DmBin (Join-Path $env:RUNNER_TEMP "dm.exe") `
            -WorkDir (Join-Path $env:RUNNER_TEMP "dm-completion-ps51") `
            -NoDocker `
            -KeepWorkDir
      - name: Upload completion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-${{ matrix.os }}
          path: ${{ runner.temp }}/dm-completion-*
          if-no-files-found: error

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux install smoke
        if: runner.os == 'Linux'
        run: bash scripts/e2e.sh --mode install
      - name: Linux release package smoke
        if: runner.os == 'Linux'
        run: |
          bash scripts/package-release.sh \
            --dist-dir "$RUNNER_TEMP/dm-release" \
            --version ci \
            --commit "$GITHUB_SHA" \
            --platform linux/amd64 \
            --no-test
          archive="$RUNNER_TEMP/dm-release/ci-$GITHUB_SHA/dm_ci_linux_amd64.tar.gz"
          contents=$(tar -tzf "$archive")
          grep -q '/CHANGELOG.md$' <<<"$contents"
          grep -q '/docs/TESTING.md$' <<<"$contents"
          grep -q '/docs/RELEASE_CHECKLIST.md$' <<<"$contents"
          grep -q '/docs/DOCKER_API_MIGRATION.md$' <<<"$contents"
      - name: Windows install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o dm.exe .
          $root = Join-Path $env:RUNNER_TEMP "dm-install-smoke"
          $config = Join-Path $env:RUNNER_TEMP "dm-install-smoke-config"
          ./scripts/install.ps1 -Binary ./dm.exe -InstallDir $root -ConfigDir $config -NoEnvironment -NoCompletionProfile
          & (Join-Path $root "bin/dm.exe") version
          ./scripts/uninstall.ps1 -InstallDir $root -ConfigDir $config -Purge
          if ((Test-Path $root) -or (Test-Path $config)) { throw "install smoke cleanup failed" }

  docker-e2e:
    name: Docker ${{ matrix.docker }} E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: ['24', '27', '29']
    services:
      docker:
        image: docker:${{ matrix.docker }}-dind
        env:
          DOCKER_TLS_CERTDIR: ''
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Docker daemon identity
        run: docker version
      - name: Full destructive E2E
        run: bash scripts/e2e.sh --mode full --confirm-destructive
