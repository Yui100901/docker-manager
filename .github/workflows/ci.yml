name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.1
  GOVULNCHECK_VERSION: v1.7.0
  GOSEC_VERSION: v2.28.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Unit tests with coverage
        if: runner.os == 'Linux'
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: runner.os == 'Linux'
        run: |
          go run ./scripts/coverage-check \
            -profile coverage.out \
            -total 70 \
            -package internal/appconfig=85 \
            -package internal/dockerconfig=90 \
            -package internal/registryauth=85 \
            -package internal/runconfig=90 \
            -package internal/targets=95 \
            -package internal/docker=65 \
            -package internal/completion=85
      - name: Upload coverage profile
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: warn
      - name: Unit tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - run: go vet ./...
      - name: PowerShell checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1 -NoGoChecks -NoShellCheck
      - name: Shell syntax and ShellCheck
        if: runner.os == 'Linux'
        run: bash scripts/check.sh --no-go-checks

  security-static:
    name: Race and security/static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
      - name: Staticcheck gate
        run: |
          set -o pipefail
          staticcheck ./... 2>&1 | tee staticcheck-report.txt
      - name: Vulnerability gate
        if: always()
        run: govulncheck ./...
      - name: Upload staticcheck triage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staticcheck-report
          path: staticcheck-report.txt
          if-no-files-found: error
      - name: gosec triage report
        if: always()
        run: gosec -no-fail -fmt text ./... | tee gosec-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gosec-report
          path: gosec-report.txt
